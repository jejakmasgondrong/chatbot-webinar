<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatbot Webinar — Eintio</title>
<style>
  :root {
    --cream: #EEE9E2;
    --slate: #41526D;
    --teal: #14B8A6;
    --navy: #282F3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--cream); color: var(--navy); padding: 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px;
          background: var(--slate); color: #fff; border-radius: 14px 14px 0 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); }
  .head b { font-size: 15px; }
  .head small { display: block; opacity: .75; font-size: 12px; }
  #log { height: 360px; overflow-y: auto; padding: 14px; background: #fff;
         border: 1px solid #d8d2c8; border-top: 0; }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 12px; margin: 0 0 10px;
         font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .bot { background: var(--cream); border-bottom-left-radius: 3px; }
  .me { background: var(--teal); color: #fff; margin-left: auto; border-bottom-right-radius: 3px; }
  form { display: flex; gap: 8px; padding: 10px; background: var(--slate); border-radius: 0 0 14px 14px; }
  input { flex: 1; padding: 11px 12px; border: 0; border-radius: 8px; font-size: 14px; }
  button { padding: 11px 16px; border: 0; border-radius: 8px; background: var(--teal);
           color: #fff; font-weight: 600; cursor: pointer; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .quick button { background: #fff; color: var(--slate); border: 1px solid #d8d2c8;
                  padding: 6px 10px; font-weight: 500; font-size: 13px; }
  .typing { color: #7c8496; }
  .typing::after { content: "."; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="dot"></span>
    <div><b>Eintio Chatbot</b></div>
  </div>
  <div id="log"></div>
  <form id="form">
    <input id="text" placeholder="Tulis pesan..." autocomplete="off" />
    <button type="submit">Kirim</button>
  </form>
</div>

<script>
/* Jawaban chatbot. Sumber: ground-doc.md
   Setiap intent punya beberapa variasi (diputar) + followUp (pertanyaan penutup)
   supaya terasa ngobrol, bukan nempel template. Urutan penting: yang cocok
   pertama menang, jadi "topik" harus sebelum "webinar". */
const INTENTS = [
  { id: "sapa",
    match: /hai|halo|hello|hi\b|pagi|siang|sore|malam|assalam/,
    replies: ["Hai! Ada yang lagi bikin penasaran?", "Halo! Mau nanya apa?", "Hey! Aku siap, tanya aja wkwk"],
    followUp: ["Tanya aja, aku bantu.", "Mau nanya apa?"] },

  { id: "topik",
    match: /\bapa\w*|topik|topic|materi|discuss|isi\b|ngomongin|bahasain/i,
    replies: [
      "Nah, ini yang seru. Bahasnya bikin chatbot dari nol, biar kamu bisa bikin yang versimu sendiri tanpa nunggu tim IT.",
      "Intinya ngajarin bikin chatbot dasar, dari yang paling simpel sampai bisa bales pertanyaan kamu.",
      "Isinya ngobrol soal bikin chatbot. Nggak pakai tools ribet, pure nulis kode sendiri.",
    ] },

  /* "jadwal" harus sebelum "webinar": "kapan webinarnya dimulai?" mengandung
     kata "webinar", jadi tanpa urutan ini yang jawab "lagi kami adain". */
  { id: "jadwal",
    match: /kapan|tanggal|jam|mulai|live|waktu|besok|lusa/i,
    replies: [
      "Tinggal 16 Oktober 2026 ya. Jangan lupa ya!",
      "Kalau tanggalnya 16 Oktober 2026 ya, detail waktunya menyusul.",
      "Insyaallah di 16 Oktober 2026. Sabar ya!",
    ] },

  { id: "webinar",
    match: /webinar|webinaran|acara|event|seminar/i,
    replies: [
      "Iya bener, lagi kami adain! Bentar ya, masih diracik.",
      "Nah, webinar-nya lagi kami siapkan. Nanti tanggalnya kami kabari ya.",
      "Betul, lagi disiapin. Sabar ya, belum lama lagi.",
    ],
    followUp: ["Kamu mau tahu apa soal webinar ini?"] },

  { id: "narasum",
    match: /narasum|narasumber|staros|pembicara|speaker|pemateri|siapa|dosen|pengajar/i,
    replies: [
      "Mau tau? Coba check di sini ya.",
      "Penasaran? Coba cek yang ini ya.",
      "Mau tahu? Coba check yang ini ya.",
    ],
    followUp: [
      "Kalau belum kebaca, tanya aja WA kami di 081122225804.",
      "Kalau ada yang kurang jelas, langsung tanya aja WA kami di 081122225804.",
      "Belum kebaca? Chat WA kami aja di 081122225804 ya.",
    ] },

  { id: "gratis",
    match: /gratis|free|biaya|harga|rp|transfer|bayar|mahal|murah/i,
    replies: [
      "Gratis banget kok, 0 rupiah. Nggak ada biaya sama sekali.",
      "Nggak dipungut biaya apa-apa. Tinggal daftar aja.",
      "Free ya, beneran. Nggak ada biaya tersembunyi kok, santai saja.",
    ] },

  { id: "daftar",
    match: /daftar|register|ikut|join|link|pendaftaran|how to/i,
    replies: [
      "Kalau mau ikut, tinggal daftar lewat link yang kami kirim ya.",
      "Pakai link registrasi yang sudah kami kirim. Kalau belum kebaca, bilang aja.",
      "Cukup klik link registrasi yang kami kirim, beres.",
    ] },

  { id: "kontak",
    match: /kontak|wa\b|whatsapp|hp|nomor|hubungi|contact|telp|telepon/i,
    replies: [
      "Bisa langsung WA kami: 081122225804 ya.",
      "Kalau mau tanya-tanya dulu, chat aja WA kami di 081122225804.",
      "Nomor kami 081122225804, langsung chat aja.",
    ] },

  { id: "makasih",
    match: /terima kasih|makasih|thanks|thank you|ok thanks/i,
    replies: [
      "Sama-sama! Semoga membantu.",
      "Sama-sama, senang bisa bantu.",
    ] },
];

/* Follow-up generik kalau user cuma lanjut ngobrol pendek */
const FOLLOWUPS = [
  "Lanjut, ada lagi yang mau ditanyain?",
  "Terus, mau nanya yang lain?",
  "Oke, mau lanjut bahas apa?",
];

const FALLBACK = [
  "Hmm, itu belum bisa saya jawab. Coba tanya: webinar apa, siapa narasumber, kapan jadwalnya, atau hubungi WA 081122225804.",
  "Maaf aku belum nangkep. Mau tanya soal webinar, narasumber, jadwal, atau biayanya?",
];

let turn = 0;
const pick = arr => arr[turn++ % arr.length];

function route(text) {
  const q = (text || "").toLowerCase();
  return INTENTS.find(i => i.match.test(q)) || null;
}

function replyTo(text) {
  const hit = route(text);
  if (!hit) return pick(FALLBACK);
  const base = pick(hit.replies);
  const tail = hit.followUp || FOLLOWUPS;
  return base + " " + pick(tail);
}

/* ---- self-check: buka ?test=1 di browser, hasil di console ---- */
if (new URLSearchParams(location.search).has("test")) {
  const cases = [
    ["hai eintio ?", "sapa"],
    ["kita mau adakan webinar ?", "webinar"],
    ["webinar apa ?", "topik"],
    ["webinar apaan ?", "topik"],
    ["materinya apa ?", "topik"],
    ["siapa narasumnya ?", "narasum"],
    ["kapan ?", "jadwal"],
    /* regression: "webinar" harus kalah dari "jadwal" di pertanyaan ini */
    ["kapan webinarnya dimulai ?", "jadwal"],
    ["gratis ?", "gratis"],
    ["cara daftar ?", "daftar"],
    ["kontak ?", "kontak"],
    ["makasih !", "makasih"],
    ["zzzz", null],
  ];
  let fail = 0;
  for (const [q, want] of cases) {
    const got = route(q)?.id ?? null;
    if (got !== want) { fail++; console.error("FAIL", q, "want", want, "got", got); }
  }
  console.assert(fail === 0, `${fail} case gagal`);
  console.log(fail === 0 ? "PASS semua case" : "ADA GAGAL");
}
</script>

<script>
const log = document.getElementById("log");
function bubble(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function send(text) {
  if (!text.trim()) return;
  bubble(text, "me");
  const reply = replyTo(text);
  const pending = bubble("sedang ngetik", "bot typing");
  const wait = Math.min(700 + reply.length * 12, 2200) + Math.random() * 400;
  setTimeout(() => { pending.remove(); bubble(reply, "bot"); }, wait);
}
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("text");
  send(input.value);
  input.value = "";
});
</script>
</body>
</html>
